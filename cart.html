<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Velour Society</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&display=swap');

    :root {
      --font-heading: 'Playfair Display', serif;
      --font-body: 'Montserrat', sans-serif;
      --color-gold: #d4af37;
      --dark: #111;
      --gray: #666;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background: linear-gradient(to bottom right, #fffaf0, #f5f5f5);
      color: var(--dark);
    }

    header {
      position: sticky;
      top: 0;
      background: rgba(10, 10, 10, 0.95);
      color: white;
      z-index: 1000;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 3rem;
    }

    .logo {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      letter-spacing: 4px;
      color: var(--color-gold);
      text-transform: uppercase;
    }

    .main-menu {
      list-style: none;
      display: flex;
      gap: 2rem;
    }

    .main-menu li a {
      color: white;
      text-decoration: none;
      transition: 0.3s;
    }

    .main-menu li a:hover {
      color: var(--color-gold);
    }

    .icons input {
      padding: 0.4rem 0.8rem;
      border: 1px solid #fff;
      background: transparent;
      color: #fff;
      border-radius: 20px;
      margin-right: 10px;
    }

    .cart-container {
      max-width: 1200px;
      margin: 60px auto;
      padding: 20px;
    }

    .cart-container h1 {
      text-align: center;
      font-family: var(--font-heading);
      font-size: 3rem;
      margin-bottom: 40px;
    }

    .cart-content {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 40px;
    }

    .cart-items, .order-summary {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    .cart-item {
      display: flex;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item img {
      width: 100px;
      height: 120px;
      border-radius: 10px;
      object-fit: cover;
      margin-right: 20px;
    }

    .item-details { flex: 1; }
    .item-details h4 { font-family: var(--font-heading); }
    .remove { color: #e74c3c; font-size: 0.9rem; cursor: pointer; }

    .quantity-control {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .quantity-control button {
      width: 25px;
      height: 25px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
    }

    .order-summary h3 {
      border-bottom: 1px solid #ddd;
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
    }

    .summary-item.total {
      font-weight: bold;
      border-top: 1px solid #ddd;
      padding-top: 15px;
    }

    .checkout-btn {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      border: none;
      background: var(--color-gold);
      color: var(--dark);
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
    }

    .empty-msg {
      text-align: center;
      padding: 50px;
      color: var(--gray);
      font-size: 1.2rem;
    }

    @media(max-width: 900px) {
      .cart-content { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo">Velour Society</div>
      <ul class="main-menu">
        <li><a href="categories.html">Shop</a></li>
        <li><a href="index.html#our-story">Our Story</a></li>
        <li><a href="index.html#page-footer">Contact</a></li>
      </ul>
      <div class="icons">
        <input type="text" placeholder="Search...">
        <a href="cart.html">🛒</a>
      </div>
    </nav>
  </header>

  <div class="cart-container">
    <h1>Your Cart</h1>
    <div class="cart-content">
      <div class="cart-items" id="cartItems">
        <div class="empty-msg" id="emptyMessage">Your cart is empty.</div>
      </div>

      <div class="order-summary">
        <h3>Order Summary</h3>
        <div class="summary-item"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
        <div class="summary-item"><span>Tax (8%)</span><span id="tax">$0.00</span></div>
        <div class="summary-item total"><span>Total</span><span id="total">$0.00</span></div>
        <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
      </div>
    </div>
  </div>

  <script>
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    const cartContainer = document.getElementById('cartItems');
    const emptyMsg = document.getElementById('emptyMessage');

    function renderCart() {
      cartContainer.innerHTML = '';
      if (cart.length === 0) {
        emptyMsg.style.display = 'block';
        cartContainer.appendChild(emptyMsg);
      } else {
        emptyMsg.style.display = 'none';
        cart.forEach((item, index) => {
          const div = document.createElement('div');
          div.classList.add('cart-item');
          div.dataset.price = item.price;

          div.innerHTML = `
            <img src="${item.image}" alt="${item.name}">
            <div class="item-details">
              <h4>${item.name}</h4>
              <p>${item.details || ''}</p>
              <span class="remove" onclick="removeItem(${index})">Remove</span>
            </div>
            <div class="quantity-control">
              <button onclick="changeQty(${index}, -1)">−</button>
              <span class="quantity">${item.qty}</span>
              <button onclick="changeQty(${index}, 1)">+</button>
            </div>
            <div class="item-total-price">$${(item.price * item.qty).toFixed(2)}</div>
          `;
          cartContainer.appendChild(div);
        });
      }
      updateTotals();
    }

    function changeQty(index, change) {
      cart[index].qty += change;
      if (cart[index].qty < 1) cart[index].qty = 1;
      saveCart();
      renderCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      saveCart();
      renderCart();
    }

    function updateTotals() {
      let subtotal = 0;
      cart.forEach(item => subtotal += item.price * item.qty);
      const tax = subtotal * 0.08;
      const total = subtotal + tax;
      document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
      document.getElementById('tax').textContent = `$${tax.toFixed(2)}`;
      document.getElementById('total').textContent = `$${total.toFixed(2)}`;
    }

    function saveCart() {
      localStorage.setItem('cart', JSON.stringify(cart));
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }
      localStorage.setItem('subtotal', document.getElementById('subtotal').textContent);
      localStorage.setItem('tax', document.getElementById('tax').textContent);
      localStorage.setItem('total', document.getElementById('total').textContent);
      window.location.href = "checkout.html";
    }

    renderCart();
  </script>
</body>
</html>
